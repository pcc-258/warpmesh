name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Code smell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v8
        with:
          args: run ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint web
        working-directory: web
        run: |
          npm ci
          npx eslint .
          npx tsc --noEmit

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests
        run: go test ./...
      # The relay is heavily concurrent (session maps, per-connection write
      # mutexes). Race regressions must fail CI, not reach main.
      - name: Go tests (race detector)
        run: go test -race ./...
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      # The server embeds web/dist, so a stale committed bundle must fail CI.
      - name: Verify embedded web assets are current
        run: git diff --exit-code -- web/dist
