name: CI

on:
  pull_request:
  push:
    branches: ['**']
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate workflow definitions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint and typecheck web
        working-directory: web
        run: |
          npm ci
          npx eslint .
          npx tsc --noEmit

  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check web runtime dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  test:
    name: Native tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
            artifact: linux-amd64
            exe: ''
          - name: Windows AMD64
            runner: windows-2025
            artifact: windows-amd64
            exe: '.exe'
          - name: macOS Intel
            runner: macos-15-intel
            artifact: darwin-amd64
            exe: ''
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: darwin-arm64
            exe: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test web
        working-directory: web
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run build
      - name: Verify embedded web assets
        if: runner.os == 'Linux'
        run: |
          git diff --exit-code -- web/dist
          test -z "$(git ls-files --others --exclude-standard web/dist)"
      - name: Platform information
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          mkdir -p reports bin
      # integration/TestNativeAgentSmoke builds and launches the real binaries.
      # It checks enrollment, PTY/ConPTY, multi-chunk file transfer and restart.
      - name: Native Go tests and process smoke
        run: |
          set -o pipefail
          go test -count=1 -timeout=15m -json ./... | tee reports/go-tests.json
      - name: Go tests with race detector
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=15m -json ./... | tee reports/go-race.json
      - name: Build native binaries
        env:
          EXE: ${{ matrix.exe }}
        run: |
          go build -o "bin/warpmesh-server${EXE}" ./cmd/server
          go build -o "bin/warpmesh-agent${EXE}" ./cmd/agent
      - name: Acceptance coverage
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo "Native tests cover server/agent startup, enrollment and persisted identity, terminal command execution, binary upload/download, and reconnect preserving inventory edits."
            echo "**Not covered:** real desktop capture/input, macOS screen permissions, Windows UAC/login screen, or multi-monitor behavior. VNC TCP readiness is not desktop GUI acceptance."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports-${{ matrix.artifact }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: warpmesh-native-${{ matrix.artifact }}
          path: bin/
          retention-days: 7

  package:
    name: Package supported platforms
    needs: [lint, security, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Package server and agent with checksums
        run: bash .github/scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: warpmesh-packages
          path: packages/
          if-no-files-found: error
          retention-days: 7

  checks:
    name: Required checks
    if: always()
    needs: [lint, security, test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
